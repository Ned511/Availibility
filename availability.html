<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

.av-root, .av-root * { box-sizing: border-box; }

.av-root {
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #1e222b;
  --surface-3: #262b36;
  --border: #2a2f3a;
  --text: #e8eaed;
  --text-dim: #8b93a5;
  --text-faint: #565d6d;
  --accent: #ff8a3d;
  --accent-2: #ec1a68;
  --accent-dim: #7a3a2e;
  --accent-grad: linear-gradient(90deg, #ff8a3d, #ec1a68);
  --available: #3ecf8e;
  --available-dim: #1d4a37;
  --sold: #ff6b6b;
  --sold-dim: #522427;
  --ps5: #7c9bff; --ps5-dim: #26305c;
  --ps4: #c98bff; --ps4-dim: #3a2a58;
  --sec: #f2b84b; --sec-dim: #4a3a1c;

  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
  padding: 22px 16px 50px;
  border-radius: 12px;
}

.av-wrap { max-width: 1080px; margin: 0 auto; }
.av-header { text-align: center; margin-bottom: 18px; }
.av-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 22px; }
.av-sub { color: var(--text-dim); font-size: 12.5px; margin-top: 4px; }

.av-toolbar { display: flex; gap: 8px; margin-bottom: 14px; max-width: 520px; margin-left: auto; margin-right: auto; }
.av-search { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 10px; font-size: 14px; font-family: inherit; }
.av-search:focus { outline: none; border-color: var(--accent-dim); }
.av-search::placeholder { color: var(--text-faint); }
.refresh-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); width: 42px; border-radius: 10px; cursor: pointer; font-size: 16px; }
.refresh-btn:hover { color: var(--text); border-color: var(--accent-dim); }
.refresh-btn.spinning { animation: spin 0.6s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

.status-line { text-align: center; font-size: 11.5px; color: var(--text-faint); margin-bottom: 18px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent-dim); transform: translateY(-2px); }

.card-img-wrap { width: 100%; aspect-ratio: 1 / 1; background: var(--surface-2); position: relative; overflow: hidden; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-img-fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 30px; color: rgba(255,255,255,0.85);
}

.stock-badge {
  position: absolute; top: 8px; right: 8px; font-size: 10.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 20px; letter-spacing: .02em; text-transform: uppercase;
}
.stock-badge.in { background: rgba(62,207,142,0.92); color: #06231a; }
.stock-badge.out { background: rgba(255,107,107,0.92); color: #2a0d0d; }

.card-body { padding: 11px 12px 13px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.card-title { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13.5px; line-height: 1.3; min-height: 35px; }
.card-price { font-size: 15px; font-weight: 700; color: var(--accent); }
.card-price .from { font-size: 10.5px; color: var(--text-faint); font-weight: 500; text-transform: uppercase; display: block; margin-bottom: 1px; }

.slot-mini-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
.slot-mini { font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 6px; display: flex; align-items: center; gap: 4px; }
.slot-mini.avail { background: var(--available-dim); color: var(--available); }
.slot-mini.sold { background: var(--surface-3); color: var(--text-faint); text-decoration: line-through; }

.empty-state { text-align: center; padding: 70px 20px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: 12px; }
.empty-state .big { font-family: 'Rajdhani', sans-serif; font-size: 17px; color: var(--text); margin-bottom: 6px; }

.connect-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; max-width: 400px; margin: 60px auto; text-align: center; }
.connect-box input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin: 12px 0; font-family: inherit; }
.connect-box p { color: var(--text-dim); font-size: 12.5px; }
.btn-primary { background: var(--accent-grad); border: none; color: #fff; font-weight: 700; padding: 11px 14px; border-radius: 24px; font-size: 13px; cursor: pointer; width: 100%; font-family: inherit; box-shadow: 0 4px 18px rgba(236,26,104,0.35); }
</style>

<div class="av-root">
  <div class="av-wrap">
    <div class="av-header">
      <div class="logo-mark" style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:11px; background:#0e0c11; border:1px solid var(--accent-2); box-shadow:0 0 14px rgba(236,26,104,0.35); margin-bottom:8px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L21 9L12 22L3 9L12 2Z" stroke="url(#gvGrad2)" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M3 9H21M9 9L12 22M15 9L12 22M12 2L8.5 9M12 2L15.5 9" stroke="url(#gvGrad2)" stroke-width="0.8" opacity="0.6"/>
          <defs><linearGradient id="gvGrad2" x1="3" y1="2" x2="21" y2="22"><stop stop-color="#ff8a3d"/><stop offset="1" stop-color="#ec1a68"/></linearGradient></defs>
        </svg>
      </div>
      <div class="av-title" style="font-family:'Orbitron', sans-serif;">GAME VAULT</div>
      <div class="av-sub">Live stock — tap ↻ any time for the latest</div>
    </div>

    <div id="connectWrap"></div>

    <div id="mainWrap" style="display:none;">
      <div class="av-toolbar">
        <input class="av-search" id="avSearch" placeholder="Search a game...">
        <button class="refresh-btn" id="refreshBtn" title="Refresh">↻</button>
      </div>
      <div class="status-line" id="statusText">Loading...</div>
      <div id="listRoot"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const LS_URL_KEY = 'gv_reseller_script_url';
  const DEFAULT_RESELLER_URL = 'https://script.google.com/macros/s/AKfycbyw-81G7AI9Pm2OTqqb92f770-1b89xnJjOLIwlRm2q_Ng4meXNDBI3Kq81MYlMN0IVrg/exec';

  const FALLBACK_COLORS = ['#4da3ff', '#7c9bff', '#c98bff', '#f2b84b', '#3ecf8e', '#ff6b6b'];

  let listings = [];
  let searchTerm = '';

  const $ = (sel) => document.querySelector(sel);

  function getUrl(){
    try { const s = localStorage.getItem(LS_URL_KEY); if (s) return s; } catch(e){}
    return DEFAULT_RESELLER_URL;
  }
  function setUrl(u){ try { localStorage.setItem(LS_URL_KEY, u); } catch(e){} }

  function escapeHtml(str){ return (str||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderConnectBox(){
    $('#connectWrap').innerHTML = `
      <div class="connect-box">
        <div style="font-weight:700; margin-bottom:4px;">Connect to availability feed</div>
        <p>Paste the link your supplier gave you. This page only shows stock — no account details are ever sent here.</p>
        <input id="urlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(getUrl())}">
        <button class="btn-primary" id="connectBtn">Connect</button>
      </div>`;
    $('#connectBtn').addEventListener('click', () => {
      const u = $('#urlInput').value.trim();
      if (!u) return;
      setUrl(u);
      init();
    });
  }

  async function fetchListings(){
    const url = getUrl();
    if (!url) return null;
    const res = await fetch(url + '?t=' + Date.now(), { method: 'GET', cache: 'no-store' });
    const text = await res.text();
    return text ? JSON.parse(text) : [];
  }

  function matches(game){
    if (!searchTerm) return true;
    return game.name.toLowerCase().includes(searchTerm.toLowerCase());
  }

  function initialsFor(name){
    return name.slice(0, 2).toUpperCase();
  }

  function colorFor(name){
    let h = 0;
    for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return FALLBACK_COLORS[Math.abs(h) % FALLBACK_COLORS.length];
  }

  function tagClass(type){
    if (type === 'ps5_primary') return 'ps5';
    if (type === 'ps4_primary') return 'ps4';
    return 'sec';
  }
  function shortLabel(label){
    return (label || '').replace('Primary', '').trim();
  }

  const SLOT_ORDER = ['ps5_primary', 'ps4_primary', 'secondary'];

  function buildGameIndex(listings){
    const map = {};
    listings.forEach(listing => {
      const games = (listing.games || '').split(',').map(g => g.trim()).filter(Boolean);
      if (games.length === 0) return;
      games.forEach(g => {
        const key = g.toLowerCase();
        if (!map[key]){
          map[key] = { name: g, slots: {} };
          SLOT_ORDER.forEach(t => map[key].slots[t] = { avail: 0, total: 0, minPrice: null, label: '' });
        }
        (listing.slots || []).forEach(s => {
          const bucket = map[key].slots[s.type];
          if (!bucket) return;
          bucket.total++;
          bucket.label = s.label;
          if (s.status === 'available'){
            bucket.avail++;
            const p = parseFloat(s.price);
            if (!isNaN(p) && (bucket.minPrice === null || p < bucket.minPrice)) bucket.minPrice = p;
          }
        });
      });
    });
    return Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
  }

  function renderCard(game){
    const anyAvailable = SLOT_ORDER.some(t => game.slots[t].avail > 0);
    const prices = SLOT_ORDER.map(t => game.slots[t].minPrice).filter(p => p !== null);
    const from = prices.length ? Math.min(...prices) : null;
    const initials = initialsFor(game.name);
    const color = colorFor(game.name);

    const imgHtml = `<div class="card-img-fallback" style="background:${color}">${initials}</div>`;

    return `<div class="card">
      <div class="card-img-wrap">
        ${imgHtml}
        <span class="stock-badge ${anyAvailable ? 'in' : 'out'}">${anyAvailable ? 'In Stock' : 'Sold Out'}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${escapeHtml(game.name)}</div>
        <div class="card-price">${from !== null ? `<span class="from">From</span>${from}` : '<span style="color:var(--text-faint); font-weight:500; font-size:12px;">Currently unavailable</span>'}</div>
        <div class="slot-mini-row">
          ${SLOT_ORDER.filter(t => game.slots[t].total > 0).map(t => {
            const b = game.slots[t];
            return `<span class="slot-mini ${b.avail > 0 ? 'avail' : 'sold'}">${escapeHtml(shortLabel(b.label))}${b.avail > 0 ? ' ×' + b.avail : ''}</span>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }

  function render(){
    const root = $('#listRoot');
    const games = buildGameIndex(listings);
    const filtered = games.filter(matches);
    if (games.length === 0){
      root.innerHTML = `<div class="empty-state"><div class="big">Nothing listed yet</div><div>Check back shortly, or ask your supplier.</div></div>`;
      return;
    }
    if (filtered.length === 0){
      root.innerHTML = `<div class="empty-state"><div class="big">No matches</div><div>Try a different game name.</div></div>`;
      return;
    }
    root.innerHTML = `<div class="grid">${filtered.map(renderCard).join('')}</div>`;
  }

  $('#avSearch') && $('#avSearch').addEventListener('input', (e) => { searchTerm = e.target.value; render(); });
  $('#refreshBtn') && $('#refreshBtn').addEventListener('click', () => { $('#refreshBtn').classList.add('spinning'); load(); setTimeout(()=>$('#refreshBtn').classList.remove('spinning'), 600); });

  async function load(){
    $('#statusText').textContent = 'Refreshing...';
    try {
      const data = await fetchListings();
      listings = Array.isArray(data) ? data : [];
      $('#statusText').textContent = 'Updated ' + new Date().toLocaleTimeString();
      render();
    } catch(e){
      $('#statusText').textContent = 'Could not refresh — check your connection';
    }
  }

  let pollTimer = null;
  function init(){
    if (!getUrl()){
      $('#connectWrap').style.display = 'block';
      $('#mainWrap').style.display = 'none';
      renderConnectBox();
      return;
    }
    $('#connectWrap').style.display = 'none';
    $('#mainWrap').style.display = 'block';
    load();
    clearInterval(pollTimer);
    pollTimer = setInterval(load, 45000);
  }

  renderConnectBox();
  init();
})();
</script>
